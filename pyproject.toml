[project]
name = "dar-lab"
version = "0.1.0"
description = "Diagnostics-Aware Recovery — BUILD ToolMaze  = ../DECISIONS.md = ../BUILD-PLAN.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
